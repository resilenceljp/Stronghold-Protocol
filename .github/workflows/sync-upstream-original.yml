name: 同步最原版正式版到独立分支
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
permissions:
  contents: write
concurrency:
  group: sync-upstream-original
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Preserve original release without replacing entertainment code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh api repos/sganggs/Stronghold-Protocol/releases/latest --jq .tag_name)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch https://github.com/sganggs/Stronghold-Protocol.git "refs/tags/$tag"
          sha=$(git rev-parse FETCH_HEAD^{commit})
          target=upstream/original
          if git show-ref --verify --quiet "refs/remotes/origin/$target"; then
            git merge-base --is-ancestor "origin/$target" "$sha"
          fi
          git push origin "$sha:refs/heads/$target"
          snapshot="upstream-original/$tag-${sha:0:12}"
          if ! git ls-remote --exit-code --heads origin "$snapshot" >/dev/null 2>&1; then
            git push origin "$sha:refs/heads/$snapshot"
          fi
          printf 'Original release: %s\nCommit: %s\nEntertainment is unchanged; merge and test before changing its version.\n' "$tag" "$sha" >> "$GITHUB_STEP_SUMMARY"
